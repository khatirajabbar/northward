<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- never zoom: iPhone Safari zooms in when you tap a small text box (the sign-in's), and stays zoomed -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- added to a phone's home screen, it opens without the browser's bars, using all of the screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#000000" />
    <title>northward</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <!-- the sign-in page: a wooden board hung by the road, over the title
         screen. main.js keeps it exactly over the canvas, at its scale -->
    <div id="login-overlay">
      <form id="login-form" class="login-sign" novalidate>
        <span class="login-rope"></span><span class="login-rope"></span>
        <h1 id="login-heading">who's walking today?</h1>
        <div id="login-error" class="login-error" hidden></div>

        <!-- only when making an account -->
        <div class="login-field login-field-name">
          <label for="login-name">traveler's name</label>
          <input id="login-name" type="text" placeholder="what the board will call you" autocomplete="username" spellcheck="false" maxlength="50" />
        </div>

        <div class="login-field login-field-email">
          <label for="login-email">email</label>
          <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" spellcheck="false" />
        </div>

        <div class="login-field login-field-password">
          <label for="login-password">password</label>
          <input id="login-password" type="password" placeholder="your password" autocomplete="current-password" />
        </div>

        <button id="login-submit" class="login-submit" type="submit">enter the forest</button>

        <p class="login-link">
          <span id="login-switch-ask">no account?</span> <a id="login-switch" href="#">make one here</a>
        </p>

        <!-- the other way on: without an account (or, later, without keeping the journey) -->
        <button id="login-other" class="login-other" type="button">or just walk, without one</button>
      </form>

      <button id="fullscreen-toggle" class="title-chip" type="button">
        <img src="/assets/ui/fullscreen.png" alt="" /><span>full screen</span>
      </button>
      <button id="sound-toggle" class="title-chip title-chip-right" type="button">
        <img src="/assets/ui/sound.png" alt="" /><span>sound on</span>
      </button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
