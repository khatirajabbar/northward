<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>northward</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <!-- the sign-in page: a wooden board hung by the road, over the title
         screen. main.js keeps it exactly over the canvas, at its scale -->
    <div id="login-overlay">
      <form id="login-form" class="login-sign" novalidate>
        <span class="login-rope"></span><span class="login-rope"></span>
        <h1>who's walking today?</h1>
        <div id="login-error" class="login-error" hidden></div>

        <div class="login-field">
          <label for="login-email">email</label>
          <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" spellcheck="false" />
        </div>

        <div class="login-field">
          <label for="login-password">password</label>
          <input id="login-password" type="password" placeholder="your password" autocomplete="current-password" />
        </div>

        <button id="login-submit" class="login-submit" type="submit">enter the forest</button>

        <p class="login-link">
          no account? <a id="login-register" href="http://localhost:5222/Account/Register" target="_blank" rel="noopener">register on the website</a>
        </p>
      </form>

      <button id="fullscreen-toggle" class="title-chip" type="button">
        <img src="/assets/ui/fullscreen.png" alt="" /><span>full screen</span>
      </button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
