version: '3.9'

services:

  # ── Infrastructure ────────────────────────────────────────────

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - northward-network

  postgres-game:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_GAME_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres-game-data:/var/lib/postgresql/data
    networks:
      - northward-network

  postgres-leaderboard:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_LEADERBOARD_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres-leaderboard-data:/var/lib/postgresql/data
    networks:
      - northward-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - northward-network

  # ── Microservices ─────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: src/Services/Northward.Auth/Northward.Auth.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-auth;Port=5432;Database=${POSTGRES_AUTH_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    ports:
      - "5001:8080"
    depends_on:
      - postgres-auth
      - rabbitmq
    networks:
      - northward-network

  game-service:
    build:
      context: .
      dockerfile: src/Services/Northward.Game/Northward.Game.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-game;Port=5432;Database=${POSTGRES_GAME_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
    ports:
      - "5002:8080"
    depends_on:
      - postgres-game
      - rabbitmq
    networks:
      - northward-network

  leaderboard-service:
    build:
      context: .
      dockerfile: src/Services/Northward.Leaderboard/Northward.Leaderboard.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-leaderboard;Port=5432;Database=${POSTGRES_LEADERBOARD_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
    ports:
      - "5003:8080"
    depends_on:
      - postgres-leaderboard
      - rabbitmq
    networks:
      - northward-network

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Northward.Gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:8080"
    depends_on:
      - auth-service
      - game-service
      - leaderboard-service
    networks:
      - northward-network

  webapp:
    build:
      context: .
      dockerfile: src/WebApp/Northward.WebApp/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5004:8080"
    networks:
      - northward-network

# ── Volumes & Networks ──────────────────────────────────────────

volumes:
  postgres-auth-data:
  postgres-game-data:
  postgres-leaderboard-data:

networks:
  northward-network:
    driver: bridge
